# =====================================
# CoTURN 示例配置（仅示意）
# =====================================

listening-port=3478
tls-listening-port=5349

listening-ip=203.0.113.20
relay-ip=203.0.113.20

realm=example.com
server-name=turn.example.com

# 长时凭证机制
lt-cred-mech
userdb=/etc/turnuserdb.conf
# 或使用静态用户：
# user=turnuser:VeryStrongPassword

fingerprint
no-sslv2
no-sslv3

# 中继端口范围（根据容量规划）
min-port=49152
max-port=65535

# 证书（若启用 TLS）
# cert=/etc/ssl/certs/turn.crt
# pkey=/etc/ssl/private/turn.key

log-file=/var/log/turnserver/turn.log
simple-log

# 安全加固与限速策略请参考官方文档
