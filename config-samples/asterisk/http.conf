[general]
enable=yes
bindaddr=0.0.0.0
bindport=8088

; 若启用 TLS：
; tlsenable=yes
; tlsbindaddr=0.0.0.0:7443
; tlscertfile=/etc/asterisk/keys/asterisk.crt
; tlsprivatekey=/etc/asterisk/keys/asterisk.key
