; ==============================
; Asterisk 拨号计划示例（精简）
; ==============================

[general]
static=yes
writeprotect=no

[from-external]
; 假设所有外线呼入转到 1001 分机（Node.js 客户端）
exten => s,1,NoOp(Incoming call)
 same => n,Dial(PJSIP/endpoint-nodejs,30)
 same => n,Hangup()

[from-internal]
; 可扩展内部拨号逻辑
exten => 1001,1,NoOp(Node.js soft UA)
 same => n,Answer()
 same => n,Playback(hello-world)
 same => n,Hangup()
