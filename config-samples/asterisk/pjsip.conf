; ==============================
; Asterisk PJSIP 示例配置（精简）
; 请根据实际环境调整 IP/端口/证书等
; ==============================

[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060

; 如需 WSS：
;[transport-wss]
;type=transport
;protocol=wss
;bind=0.0.0.0:7443
;cert_file=/etc/asterisk/keys/asterisk.crt
;priv_key_file=/etc/asterisk/keys/asterisk.key

[endpoint-nodejs]
type=endpoint
transport=transport-udp
context=from-internal
disallow=all
allow=ulaw,alaw            ; G.711
; 若支持 SRTP/SDES：
;media_encryption=sdes
rewrite_contact=yes
force_rport=yes

[auth-nodejs]
type=auth
auth_type=userpass
username=nodeclient
password=StrongPasswordHere

[aor-nodejs]
type=aor
max_contacts=1

[endpoint-nodejs](+)
auth=auth-nodejs
aors=aor-nodejs
