# =====================================
# RTPEngine 示例配置（仅示意）
# 需结合实际网络与部署方式（单机/多网卡/内外网）调整
# =====================================

# 监听端口（示意）
LISTEN_TCP=7722
LISTEN_UDP=22222

# 公网与内网地址（示例）
# 外网用于 WebRTC（SRTP/DTLS/ICE），内网用于 Asterisk（RTP）
INTERFACE=public/203.0.113.10;private/10.0.0.10

# 允许编解码器（包含 opus 与 PCMU/PCMA）
CODECS=opus,PCMU,PCMA

# 转码启用（示意，实际需结合构建选项/命令行）
TRANSCODING=yes

# 日志级别
LOG_LEVEL=3

# 其余参数请参考官方文档与实际部署需要
